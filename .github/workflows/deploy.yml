name: Deploy to Cloud Run

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write # Workload Identity Federationでの認証に必要

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'xxxxx' }}
  REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
  SERVICE_NAME: daily-report
  REPOSITORY: daily-report

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # サービスアカウントキーは発行せず、Workload Identity連携で認証する
      # (事前に `make setup-wif` を実行し、リポジトリ変数 GCP_WORKLOAD_IDENTITY_PROVIDER /
      #  GCP_SERVICE_ACCOUNT を設定しておくこと)
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: >
          make docker-push
          PROJECT_ID=${{ env.PROJECT_ID }}
          REGION=${{ env.REGION }}
          SERVICE_NAME=${{ env.SERVICE_NAME }}
          REPOSITORY=${{ env.REPOSITORY }}
          TAG=${{ github.sha }}

      - name: Deploy to Cloud Run
        run: >
          make deploy
          PROJECT_ID=${{ env.PROJECT_ID }}
          REGION=${{ env.REGION }}
          SERVICE_NAME=${{ env.SERVICE_NAME }}
          REPOSITORY=${{ env.REPOSITORY }}
          TAG=${{ github.sha }}
